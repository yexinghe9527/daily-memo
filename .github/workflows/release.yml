name: CI / Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 每次提交都跑：数据层断言，快、不需要图形界面 ──
  test:
    name: 数据层断言
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 桌面端数据层不依赖 Electron，直接跑
      - name: 桌面数据层自检
        run: node src/selftest.js

      # 安卓数据层是浏览器版 store.js，用全局注入的方式在 Node 里跑
      - name: 安卓数据层自检
        run: node mobile/test/store.test.js

  # ── 打 tag 时才构建产物 ──
  windows:
    name: Windows 安装包
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 端到端冒烟（真启动 Electron）
        run: npm run smoke

      - name: 打包 NSIS 安装包
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  android:
    name: 安卓 APK
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest 镜像本来就预装了 Android SDK。
      # 不用 android-actions/setup-android@v3：它在托管 runner 上不稳定，
      # 一旦它失败，后面所有步骤都会被跳过（v1.0.0 首次发布就是这么挂的）。
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Capacitor 8 要求 JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 准备 Android SDK 组件
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "镜像里没找到 cmdline-tools，实际目录："
            ls -la "$SDK" || true
            exit 1
          fi
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          # 镜像里 SDK 目录可能归 root，先确保当前用户可写
          sudo chown -R "$(id -u):$(id -g)" "$SDK" 2>/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "已安装平台："
          ls "$SDK/platforms"
          echo "已安装构建工具："
          ls "$SDK/build-tools"

      # 仓库里默认配的是国内镜像（给中文 Windows 用的），CI 在海外，换回官方源更快
      - name: 切回官方 Gradle 源
        working-directory: mobile/android
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: 安装依赖并同步
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      # local.properties 在仓库里是被忽略的（各人 SDK 路径不同），CI 里现写一份
      - name: 指定 SDK 路径
        working-directory: mobile/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 自检签名配置：只输出长度、文件大小、证书指纹这类信息，绝不打印密钥内容。
      # 加这一步是因为安卓构建若挂在 gradle 里，失败原因只在日志中，而日志需要管理员
      # 权限才能看。有了它，从公开的注解里就能看出到底是「没配」「base64 复制坏了」
      # 还是「密码/别名不对」。
      - name: 签名配置自检
        env:
          KEYSTORE_B64: ${{ secrets.XINGHELU_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.XINGHELU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XINGHELU_KEY_ALIAS }}
          KEY_PW: ${{ secrets.XINGHELU_KEY_PASSWORD }}
        run: |
          echo "XINGHELU_KEYSTORE_BASE64 长度 = ${#KEYSTORE_B64}"
          echo "XINGHELU_STORE_PASSWORD  长度 = ${#STORE_PW}"
          echo "XINGHELU_KEY_ALIAS            = ${KEY_ALIAS:-（空）}"
          echo "XINGHELU_KEY_PASSWORD    长度 = ${#KEY_PW}"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "=> 没配 keystore，本次会产出未签名包（安卓装不上）"
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > /tmp/probe.keystore 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 不是合法的 base64；多半是复制时混进了别的内容（引号、说明文字或截断）"
            exit 1
          fi
          echo "解码后 $(stat -c%s /tmp/probe.keystore) 字节，类型 $(file -b /tmp/probe.keystore)"
          echo "--- keytool 校验（同时验证密码，只输出证书指纹）---"
          if ! keytool -list -keystore /tmp/probe.keystore -storepass "$STORE_PW" 2>&1 | head -12; then
            echo "::error::STORE_PASSWORD 不正确，或 keystore 本体损坏"
          fi
          echo "--- 按别名取条目 ---"
          if ! keytool -list -keystore /tmp/probe.keystore -storepass "$STORE_PW" -alias "$KEY_ALIAS" 2>&1 | head -8; then
            echo "::error::KEY_ALIAS「${KEY_ALIAS}」在 keystore 里不存在"
          fi

      # 配了 XINGHELU_KEYSTORE_BASE64 这个 Secret 才会签署名。
      # 生成方式（本机执行）：
      #   base64 -w0 xinghelu-release.keystore   （Windows: certutil -encode 后去掉头尾）
      # 再把输出存进仓库 Secret，另外三个密码/别名同理。
      - name: 准备签名密钥
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.XINGHELU_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.XINGHELU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XINGHELU_KEY_ALIAS }}
          KEY_PW: ${{ secrets.XINGHELU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            # storeFile 在 app/build.gradle 里是相对 mobile/android/app/ 解析的，
            # 用绝对路径才能保证不踩相对路径的坑
            KS="$PWD/../release.keystore"
            # 先去掉粘贴时可能混进来的换行和空格再解码 —— 这是最常见的翻车点
            if ! printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$KS" 2>/dev/null; then
              echo "::error::KEYSTORE_BASE64 解码失败，请重新复制为一整行"
              exit 1
            fi
            test -s "$KS" || { echo "::error::密钥文件写入后为空"; exit 1; }
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS" "$STORE_PW" "$KEY_ALIAS" "$KEY_PW" > keystore.properties
            echo "已注入签名配置，keystore $(stat -c%s "$KS") 字节"
          else
            echo "未配置签名 Secrets，本次将产出未签名包"
          fi

      - name: 构建 release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 让下载的人一眼看出这是哪个版本、有没有签名
      - name: 整理 APK 文件名
        working-directory: mobile/android/app/build/outputs/apk/release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in *.apk; do
            case "$f" in
              *unsigned*) mv "$f" "Xinghelu-Android-${VERSION}-unsigned.apk" ;;
              *)          mv "$f" "Xinghelu-Android-${VERSION}.apk" ;;
            esac
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # action-gh-release 只会上传新文件，不会删旧的。重发同一个 tag 时，
      # 上一轮的产物（比如改名前的 app-release-unsigned.apk）会留在 Release 里，
      # 下载的人可能正好点到那个坏包。所以先清空该 Release 的资产再上传。
      - name: 清掉该 Release 上的旧资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | while read -r name; do
              if [ -n "$name" ]; then
                echo "删除旧资产：$name"
                gh release delete-asset "$GITHUB_REF_NAME" "$name" -y
              fi
            done
          else
            echo "该 tag 还没有 Release，跳过清理"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          # latest.yml 和 blockmap 必须在 Release 里，客户端自动更新才能发现并增量下载
          files: |
            artifacts/windows-installer/*
            artifacts/android-apk/*.apk
          generate_release_notes: true
          draft: false
