<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>星河录</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shooting-star s1" aria-hidden="true"></div>
    <div class="shooting-star s2" aria-hidden="true"></div>
    <div class="shooting-star s3" aria-hidden="true"></div>

    <div class="app">
      <!-- ───────────── 侧栏 ───────────── -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">星</div>
          <div class="brand-text">
            <strong>星河录</strong>
            <span id="brandSub">数据存在本机</span>
          </div>
        </div>

        <section class="panel progress-panel">
          <div class="ring" id="progressRing">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-track" cx="60" cy="60" r="52" />
              <circle class="ring-value" id="ringValue" cx="60" cy="60" r="52" />
            </svg>
            <div class="ring-label">
              <b id="ringPct">0%</b>
              <span id="ringHint">今日完成</span>
            </div>
          </div>
          <ul class="mini-stats">
            <li><span>待办</span><b id="statRemaining">0</b></li>
            <li><span>已完成</span><b id="statDone">0</b></li>
            <li><span>连续达成</span><b id="statStreak">0</b></li>
          </ul>
        </section>

        <section class="panel">
          <header class="panel-head">
            <button id="calPrev" class="icon-btn" title="上个月">‹</button>
            <span id="calTitle">—</span>
            <button id="calNext" class="icon-btn" title="下个月">›</button>
          </header>
          <div class="weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="calendar" id="calendar"></div>
        </section>

        <section class="panel">
          <header class="panel-head"><span>最近 7 天</span><span class="muted" id="weekTotal">—</span></header>
          <div class="week-bars" id="weekBars"></div>
        </section>

        <div class="sidebar-foot">
          <button id="exportBtn" class="ghost-btn">导出备份</button>
          <button id="importBtn" class="ghost-btn">导入</button>
          <button id="revealBtn" class="ghost-btn">数据目录</button>
        </div>
      </aside>

      <!-- ───────────── 主区 ───────────── -->
      <main class="main">
        <header class="topbar">
          <div class="date-nav">
            <button id="prevDay" class="icon-btn" title="前一天">‹</button>
            <div class="date-label">
              <b id="dateTitle">—</b>
              <span id="dateSub">—</span>
            </div>
            <button id="nextDay" class="icon-btn" title="后一天">›</button>
            <button id="todayBtn" class="ghost-btn">回到今天</button>
          </div>
          <div class="topbar-right">
            <div class="search-wrap">
              <input id="searchInput" type="search" placeholder="搜索任务 / 备忘…" autocomplete="off" />
              <div id="searchResults" class="search-results" hidden></div>
            </div>
            <button id="syncBtn" class="icon-btn" title="同步">⟳</button>
            <button id="themeBtn" class="icon-btn" title="切换主题">◐</button>
            <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
          </div>
        </header>

        <div class="carry-banner" id="carryBanner" hidden></div>

        <section class="composer">
          <input id="newTitle" placeholder="添加一项任务，按回车即可…" maxlength="200" autocomplete="off" />
          <div class="composer-row">
            <select id="newPriority" title="优先级">
              <option value="0">普通</option>
              <option value="1">重要</option>
              <option value="2">紧急</option>
            </select>
            <select id="newType" title="类型">
              <option value="none">未分类</option>
              <option value="work">工作</option>
              <option value="personal">私人</option>
            </select>
            <select id="newRepeat" title="重复">
              <option value="none">不重复</option>
              <option value="daily">每天</option>
              <option value="weekdays">工作日</option>
              <option value="weekly">每周</option>
              <option value="monthly">每月</option>
            </select>
            <label class="field">
              <span>提醒</span>
              <input id="newRemind" type="datetime-local" />
            </label>
            <input id="newNote" class="note-input" placeholder="备注（可选）" maxlength="5000" autocomplete="off" />
            <button id="addBtn" class="primary-btn">添加</button>
          </div>
        </section>

        <section class="task-region">
          <header class="region-head">
            <span id="taskSummary">—</span>
            <div class="region-actions">
              <button id="clearDoneBtn" class="ghost-btn" title="删除当天所有已完成任务">清除已完成</button>
              <select id="sortMode" title="排序方式">
                <option value="manual">手动顺序</option>
                <option value="priority">按优先级</option>
                <option value="created">按创建时间</option>
              </select>
              <select id="typeFilter" title="按类型筛选">
                <option value="all">全部类型</option>
                <option value="work">只看工作</option>
                <option value="personal">只看私人</option>
                <option value="none">只看未分类</option>
              </select>
            </div>
          </header>
          <ul id="taskList" class="task-list"></ul>
          <div id="emptyState" class="empty-state" hidden>
            <div class="empty-mark">✓</div>
            <p id="emptyText">今天还没有任务，在上面输入框里加一条吧。</p>
          </div>
        </section>

        <section class="memo-region">
          <header class="region-head">
            <span>每日备忘</span>
            <span class="muted" id="memoSaved"></span>
          </header>
          <textarea id="memo" placeholder="随手记点什么，停手 600ms 自动保存…" spellcheck="false"></textarea>
        </section>
      </main>
    </div>

    <!-- ───────────── 设置 ───────────── -->
    <div class="modal" id="settingsModal" hidden>
      <div class="modal-card">
        <header class="modal-head">
          <b>设置</b>
          <button id="settingsClose" class="icon-btn">✕</button>
        </header>
        <div class="modal-body">
          <label class="row">
            <span>主题</span>
            <select id="setTheme">
              <option value="auto">跟随系统</option>
              <option value="light">浅色</option>
              <option value="dark">深色</option>
              <option value="galaxy">星辰大海</option>
            </select>
          </label>
          <label class="row">
            <span>排序方式</span>
            <select id="setSort">
              <option value="manual">手动顺序</option>
              <option value="priority">按优先级</option>
              <option value="created">按创建时间</option>
            </select>
          </label>
          <label class="row">
            <span>未完成自动顺延到今天</span>
            <input id="setCarry" type="checkbox" />
          </label>
          <label class="row">
            <span>顺延时间窗口（天）</span>
            <input id="setCarryWin" type="number" min="1" max="365" step="1" />
          </label>
          <label class="row">
            <span>开启到点提醒</span>
            <input id="setRemind" type="checkbox" />
          </label>
          <label class="row">
            <span>开机自动启动（静默驻留托盘）</span>
            <input id="setAutostart" type="checkbox" />
          </label>
          <label class="row">
            <span>点关闭按钮时最小化到托盘</span>
            <input id="setTray" type="checkbox" />
          </label>
          <label class="row" data-desktop-only>
            <span>自动检查更新</span>
            <input id="setAutoUpdate" type="checkbox" />
          </label>
          <div class="modal-actions">
            <button id="checkUpdateBtn" class="ghost-btn">检查更新</button>
          </div>
          <div class="hint" id="updateStatusText">—</div>
          <label class="row" data-desktop-only>
            <span>开启手机同步服务</span>
            <input id="setSyncServer" type="checkbox" />
          </label>
          <div class="hint" id="syncUrlText">—</div>
          <div class="hint" id="dataPathText">—</div>
          <div class="hint">快捷键：Ctrl+N 聚焦输入框 · Ctrl+F 搜索 · Alt+←/→ 切换日期 · Ctrl+S 立即保存备忘</div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
